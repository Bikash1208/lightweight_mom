# Phase 12C working design point (brief's own instruction: "Record it as a config; don't
# hard-code it"): RT/Duroid 5880, h = 1.575 mm, PEC ground (substrate.backing: pec), P = 8.0 mm,
# rectangular PEC patch, 10-15 GHz, design frequency 12.5 GHz.
#
# P = 8.0 mm is Phase 12B's own measured recommendation among the three grounded periods it
# studied (results/phase12b_mesh_period_study/): 279.2 deg S11_xx coverage at 12.5 GHz (vs 237.5
# deg at 4.8 mm and 296.6 deg at 12.0 mm), grating onset above the whole 10-15 GHz band even at a
# 45 deg feed (22.0 GHz), and a full-k0 surface-wave-pole margin across the band -- the best
# margin/coverage combination of the three, not chosen by coverage alone (PHASE12B_MESH_PERIOD_STUDY.md
# Sec. 5).
#
# geometry.length/width below (6.0 mm) is Phase 12B's own measured near-resonance L for this
# period (resonant_length_mm ~ 6.0, PHASE12B_MESH_PERIOD_STUDY.md Sec. 5); Phase 12C's own sweeps
# vary length/width away from this value (loaded via `src/phase12c/design_point.py`, which reuses
# every OTHER field here -- period, substrate, backing, reference planes -- unchanged), so this
# file's own geometry section is only the single "as configured" representative point, not a claim
# that 6.0 mm is the only length Phase 12C ever solves.
#
# mesh.cells_x/y = 40 is Phase 12B's own measured smallest mesh aligning every edge of its own
# 8 mm-period L family (1.6-7.6 mm, 0.4 mm step) -- PHASE12B_MESH_PERIOD_STUDY.md Sec. 5's table
# ("8.0 mm | 40 cells"), reused here, not re-derived. floquet_order = cells_x, the same
# floquet-order-equals-mesh-cells convention Phase 12A/12B's own grounded refinement studies
# validated as adequately converged at this mesh scale.

period_x: 8.0e-3        # [m]
period_y: 8.0e-3        # [m]

substrate:
  name: Rogers RT/Duroid 5880
  eps_r: 2.2
  tan_delta: 0.0009
  thickness: 1.575e-3   # [m]
  backing: pec          # Phase 12A: PEC ground plane at z = -thickness (no bottom port)

metal:
  model: pec

geometry:
  type: rectangle
  length: 6.0e-3        # [m] near-resonance for this period (Phase 12B measured)
  width: 6.0e-3          # [m]
  center_x: 0.0
  center_y: 0.0
  rotation_deg: 0.0

excitation:
  frequency: 12.5e9      # [Hz] design frequency
  theta_deg: 0.0
  phi_deg: 0.0
  polarization: x

mesh:
  cells_x: 40
  cells_y: 40
  floquet_order: 40

# Grounded stack: no bottom port, so bottom_air_thickness is forbidden (CONVENTIONS.md).
reference_planes:
  top_air_thickness: 5.0e-3   # [m]
