[pytest]
pythonpath = .
testpaths = tests
markers =
    slow: real MoM solves expensive enough to exclude from the fast (<5 min) suite
    cad: needs the optional cadquery/matplotlib extras (requirements-cad.txt)
    checkpoint: needs the ~470 MB Phase 7 unit-cell-library checkpoint on disk
    hfss_data: needs real HFSS exports under hfss_exports/ (not regenerable without HFSS)
